<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe - AgroTech Monitor | Registro de Colheita</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#d9d9d9;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.phone{width:375px;height:667px;background:#fff;border:3px solid #333;border-radius:24px;display:flex;flex-direction:column;overflow:hidden}
.header{background:#e0e0e0;border-bottom:2px solid #333;padding:16px;text-align:center;font-weight:bold;font-size:18px;color:#222}
.content{flex:1;padding:20px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
label{font-size:14px;font-weight:bold;color:#444;margin-top:8px}
select,input{width:100%;padding:12px;font-size:16px;background:#f5f5f5;border:2px solid #999;border-radius:6px;color:#333}
select:focus,input:focus{outline:none;border-color:#333}
.btn-save{margin-top:auto;width:100%;padding:18px;font-size:18px;font-weight:bold;color:#fff;background:#444;border:2px solid #222;border-radius:10px;cursor:pointer}
.btn-save:active{background:#222}
.nav{display:flex;border-top:2px solid #333;background:#e0e0e0}
.nav-item{flex:1;padding:10px 0;text-align:center;font-size:12px;color:#555;cursor:pointer;border-right:1px solid #999}
.nav-item:last-child{border-right:none}
.nav-item .icon{display:block;width:24px;height:24px;margin:0 auto 4px;border:2px solid #666;border-radius:4px;background:#f5f5f5}
.nav-item.active{background:#c8c8c8;font-weight:bold;color:#111}
.nav-item.active .icon{background:#777;border-color:#222}
</style>
</head>
<body>
<div class="phone">
  <div class="header">Registrar Colheita</div>
  <div class="content">
    <label for="horta">Horta</label>
    <select id="horta"><option value="">Selecione a horta</option><option>Horta Centro</option><option>Horta Vila Nova</option><option>Horta Escola</option></select>
    <label for="alimento">Alimento</label>
    <select id="alimento"><option value="">Selecione o alimento</option><option>Tomate</option><option>Alface</option><option>Cenoura</option><option>Couve</option></select>
    <label for="quantidade">Quantidade (kg)</label>
    <input type="number" id="quantidade" placeholder="Ex.: 10" min="0" step="0.1">
    <button class="btn-save" onclick="salvar()">SALVAR</button>
  </div>
  <nav class="nav">
    <div class="nav-item"><span class="icon"></span>Início</div>
    <div class="nav-item active"><span class="icon"></span>Colheitas</div>
    <div class="nav-item"><span class="icon"></span>Doações</div>
  </nav>
</div>
<script>
function salvar(){
  var h=document.getElementById('horta').value,a=document.getElementById('alimento').value,q=parseFloat(document.getElementById('quantidade').value);
  if(!h||!a||isNaN(q)||q<=0){alert('Preencha horta, alimento e uma quantidade maior que zero.');return;}
  alert('Colheita salva com sucesso!\n'+q+' kg de '+a+' ('+h+')');
}
document.querySelectorAll('.nav-item').forEach(function(i){i.addEventListener('click',function(){
  document.querySelectorAll('.nav-item').forEach(function(x){x.classList.remove('active')});i.classList.add('active');});});
</script>
</body>
</html>
